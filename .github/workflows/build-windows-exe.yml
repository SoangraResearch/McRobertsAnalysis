# Builds a Windows folder distribution under dist/McRoberts Analysis/ (see PyInstaller spec).
# Trigger manually from the Actions tab, or push to main/master.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  pyinstaller-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy matplotlib pandas pywavelets scikit-learn scikit-image oct2py octave_kernel ssqueezepy

      - name: PyInstaller
        run: python -m PyInstaller "McRoberts Analysis.spec" --clean

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: McRoberts-Analysis-Windows
          path: dist/McRoberts Analysis/
          if-no-files-found: error
