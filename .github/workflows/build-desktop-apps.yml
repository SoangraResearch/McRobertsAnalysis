# Windows: dist/McRoberts Analysis/ (exe + _internal). macOS: dist/McRoberts Analysis.app (see spec BUNDLE on darwin).
# Trigger from Actions, or push to main/master — both jobs run from the same commit.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  pyinstaller-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy matplotlib pandas pywavelets scikit-learn scikit-image oct2py octave_kernel ssqueezepy

      - name: PyInstaller
        run: python -m PyInstaller "McRoberts Analysis.spec" --clean

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: McRoberts-Analysis-Windows
          path: dist/McRoberts Analysis/
          if-no-files-found: error

  pyinstaller-macos:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy matplotlib pandas pywavelets scikit-learn scikit-image oct2py octave_kernel ssqueezepy

      - name: PyInstaller
        run: python -m PyInstaller "McRoberts Analysis.spec" --clean

      # Keeps the outer .app bundle when users unzip the artifact (plain folder upload can look like "just Contents/").
      - name: Zip macOS app
        run: ditto -c -k --keepParent "dist/McRoberts Analysis.app" "dist/McRoberts-Analysis-macOS.zip"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: McRoberts-Analysis-macOS
          path: dist/McRoberts-Analysis-macOS.zip
          if-no-files-found: error
